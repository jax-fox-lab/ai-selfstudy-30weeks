name: Update progress stats

on:
  push:
    branches: [main, master]
    paths:
      - 'data/progress.json'
      - 'scripts/generate_stats.py'
      - 'scripts/generate_index.py'
      - 'README.md'
      - 'weeks/**'
      - '.github/workflows/update-stats.yml'
  # 每周一 00:00 UTC（北京时间 08:00）兜底重算统计，保持仓库活跃
  # 注：个人周清单已是本地私有文件，不再由云端生成
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate README stats, SVG and week index
        run: |
          python3 scripts/generate_stats.py
          python3 scripts/generate_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/progress.svg weeks/INDEX.md
          if git diff --cached --quiet; then
            echo "统计无变化，跳过提交"
          else
            git commit -m "chore: auto-update progress stats"
            git push
          fi
